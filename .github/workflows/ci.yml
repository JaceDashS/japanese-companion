name: Product checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm run typecheck
      - run: npm run test:google-auth
      - run: npm run typecheck:mobile
      - run: npm run test:mobile
      - run: npm run export:web --prefix mobile
      - run: npm run export:android --prefix mobile
      - run: npm run test:stage-progression
